f;color:inherit;cursor:pointer}.item:hover,.item.active{background:#f2f6ff}.item-top{display:flex;gap:8px;align-items:center}.item strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.item small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}.pill,.sev{display:inline-block;border-radius:999px;color:#fff;font-size:12px;padding:2px 8px;font-weight:700}.critical{background:var(--critical)}.high{background:var(--high)}.medium{background:var(--medium)}.low{background:var(--low)}.safe{background:#16803c}.detail{padding:22px;min-width:0}.detail-empty{color:var(--muted);padding:40px;text-align:center}.detail-head{display:flex;align-items:flex-start;gap:18px}.score{font-size:46px;font-weight:850;line-height:1}.verdict{font-size:18px;font-weight:750}.subject{font-size:21px;font-weight:800;margin-bottom:5px;overflow-wrap:anywhere}.detail-actions{margin-left:auto}.detail-actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 11px;cursor:pointer}.meta{display:grid;grid-template-columns:125px minmax(0,1fr);gap:8px;margin-top:20px;padding:16px;background:#f7f9fc;border-radius:12px}.meta b{color:#344054}.meta span,.meta code{overflow-wrap:anywhere}.section-title{font-size:17px;margin:24px 0 8px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:#475467;font-size:13px}code{overflow-wrap:anywhere}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#eef2f7;border-radius:999px;padding:3px 9px;font-size:12px;overflow-wrap:anywhere}.notice{background:#fff8e7;border:1px solid #f4d58d;border-radius:10px;padding:10px 12px;color:#744d00;margin-top:18px}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.items{max-height:360px}}@media(max-width:600px){.wrap{padding:24px 12px}.summary{grid-template-columns:1fr 1fr}.detail{padding:1 </style></head><body><main class="wrap">
<h1>메일 위협 초기 분석기</h1><p class="lead">지원·QA·영업 데모용 EML 1차 분류. 여러 메일을 한 번에 비교하고 근거가 포함된 보고서를 내보낼 수 있습니다.</p>
<label class="drop" id="drop"><input type="file" id="file" accept=".eml,message/rfc822" multiple><strong>.eml 파일을 선택하거나 여러 파일을 여기에 끌어다 놓으세요</strong><span>최대 100개 · 파일당 25MB · 폴더에서 다중 선택 가능</span></label><p class="privacy">✓ 서버 업로드 없음 · 외부 API 호출 없음 · 파일 저장 없음</p>
<div class="toolbar" id="toolbar"><span class="count" id="count"></span><button class="secondary" id="add">파일 추가</button><button class="secondary" id="json">전체 JSON</button><button class="secondary" id="csv">요약 CSV</button><button id="html">통합 HTML 보고서</button></div>
<section class="summary" id="summary"></section>
<section class="workspace" id="workspace"><aside class="card list"><div class="list-head"><input id="search" placeholder="제목·발신자·파일 검색"><select id="filter"><option value="all">전체</option><option value="high">높은 위험</option><option value="suspicious">의심</option><option value="safe">낮은 위험</option></select></div><div class="items" id="items"></div></aside><article class="card detail" id="detail"><div class="detail-empty">왼쪽에서 분석 결과를 선택하세요.</div></article></section>
</main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const weights={critical:40,high:25,medium:10,low:3}, labels={critical:'치명',high:'높음',medium:'중간',low:'낮음'};
const shorteners=new Set(['bit.ly','tinyurl.com','t.co','goo.gl','ow.ly','is.gd','cutt.ly','rebrand.ly','buff.ly','url.kr','han.gl','vo.la']);
const riskyExt=/\.(exe|scr|js|jse|vbs|vbe|bat|cmd|com|ps1|msi|hta|lnk|iso|img|jar|apk)$/i, archiveExt=/\.(zip|rar|7z|gz|bz2|xz|cab)$/i, macroExt=/\.(docm|xlsm|pptm|xlam)$/i;
let results=[], selected=-1;
function header(text,name){const m=text.match(new RegExp('^'+name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+':\\s*([^\\r\\n]*(?:\\r?\\n[ \\t]+[^\\r\\n]*)*)','im'));return m?m[1].replace(/\r?\n[ \t]+/g,' ').trim():''}
function address(v){const m=String(v).match(/<([^>]+)>/);return (m?m[1]:v).trim().replace(/^['"]|['"]$/g,'')}
function domainOf(v){const a=address(v).toLowerCase(), i=a.lastIndexOf('@');return i>=0?a.slice(i+1).replace(/[>.]$/g,''):''}
function auth(text,k){const m=text.match(new RegExp('\\b'+k+'\\s*=\\s*(pass|fail|softfail|neutral|none|temperror|permerror)','i'));return m?m[1].toLowerCase():'unknown'}
function decodeWord(v){try{return v.replace(/=\?utf-8\?[bq]\?([^?]+)\?=/gi,(_,x)=>{try{return /\?b\?/i.test(_)?new TextDecoder().decode(Uint8Array.from(atob(x),c=>c.charCodeAt(0))):decodeURIComponent(x.replace(/_/g,' ').replace(/=([0-9A-F]{2})/gi,'%$1'))}catch{return _}})}catch{return v}}
function isIp(d){if(!/^\d{1,3}(?:\.\d{1,3}){3}$/.test(d))return false;return d.split('.').every(x=>+x<=255)}
function rootDomain(d){const p=d.toLowerCase().split('.');return p.length>2?p.slice(-2).join('.'):d}
function urlsFrom(text){const out=[];for(const m of text.matchAll(/https?:\/\/[^\s<>"']+/gi)){try{const raw=m[0].replace(/&amp;/g,'&').replace(/[.,);\]}]+$/,''),u=new URL(raw);out.push({url:raw,domain:u.hostname.toLowerCase()})}catch{}}return out}
async function analyze(file,providedBuffer){const buf=providedBuffer||await file.arrayBuffer();if(buf.byteLength>25*1024*1024)throw Error('25MB를 초과합니다');const text=new TextDecoder('utf-8',{fatal:false}).decode(buf), findings=[];const add=(severity,code,message,evidence='')=>findings.push({severity,code,message,evidence});
 const authText=[...text.matchAll(/^(?:ARC-)?Authentication-Results:\s*([^\r\n]*(?:\r?\n[ \t]+[^\r\n]*)*)/gim)].map(x=>x[1]).join(' '), a={spf:auth(authText,'spf'),dkim:auth(authText,'dkim'),dmarc:auth(authText,'dmarc')};
 for(const [k,v] of Object.entries(a)){if(['fail','softfail','permerror'].includes(v))add('high',k.toUpperCase()+'_FAIL',k.toUpperCase()+' 인증을 통과하지 못했습니다',v);else if(['none','unknown'].includes(v))add('medium',k.toUpperCase()+'_MISSING',k.toUpperCase()+' 결과가 없습니다',v);else if(['neutral','temperror'].includes(v))add('low',k.toUpperCase()+'_INDETERMINATE',k.toUpperCase()+' 결과가 확정적이지 않습니다',v)}
 const fromRaw=header(text,'From'), replyRaw=header(text,'Reply-To'), returnRaw=header(text,'Return-Path'), from=address(fromRaw), reply=address(replyRaw), fromDomain=domainOf(fromRaw), replyDomain=domainOf(replyRaw), returnDomain=domainOf(returnRaw);if(reply&&from&&reply.toLowerCase()!=from.toLowerCase())add(rootDomain(replyDomain)!=rootDomain(fromDomain)?'high':'medium','REPLY_TO_MISMATCH','Reply-To가 From과 다릅니다',from+' → '+reply);if(returnDomain&&fromDomain&&rootDomain(returnDomain)!=rootDomain(fromDomain))add('medium','RETURN_PATH_MISMATCH','Return-Path 도메인이 From과 다릅니다',fromDomain+' → '+returnDomain);const display=(fromRaw.match(/^\s*([^<]+)</)||[])[1]||'';if(display.includes('@'))add('medium','DISPLAY_NAME_ADDRESS','표시 이름에 이메일 주소가 포함되어 있습니다',display.trim());if(/[\u0400-\u04ff\u0370-\u03ff]/.test(fromDomain))add('high','CONFUSABLE_SENDER','발신자 도메인에 혼동하기 쉬운 문자 체계가 포함되어 있습니다',fromDomain);
 const names=[...text.matchAll(/filename\*?\s*=\s*(?:UTF-8''|)(?:"([^"]+)"|([^;\r\n]+))/gi)].map(m=>decodeURIComponent((m[1]||m[2]).trim()).replace(/^['"]|['"]$/g,''));for(const n of [...new Set(names)]){if(riskyExt.test(n))add('high','EXECUTABLE_ATTACHMENT','실행 파일 또는 스크립트 첨부파일입니다',n);else if(macroExt.test(n))add('high','MACRO_ATTACHMENT','매크로 실행이 가능한 문서입니다',n);else if(archiveExt.test(n))add('medium','ARCHIVE_ATTACHMENT','압축 첨부파일은 샌드박스 검토가 필요합니다',n);if(/\.(pdf|docx?|xlsx?|pptx?|jpg|png|txt)\.(exe|scr|js|vbs|bat|cmd|lnk)$/i.test(n))add('critical','DOUBLE_EXTENSION','첨부파일이 위장 이중 확장자를 사용합니다',n);if(/[\u202a-\u202e\u2066-\u2069]/.test(n))add('critical','BIDI_FILENAME','파일명에 확장자를 위장할 수 있는 양방향 제어 문자가 있습니다',n)}
 const urlObjects=urlsFrom(text), domains=[...new Set(urlObjects.map(x=>x.domain))];for(const d of domains){if(d.startsWith('xn--')||d.includes('.xn--'))add('high','PUNYCODE_URL','URL에 IDN 퓨니코드 도메인이 포함되어 있습니다',d);if(isIp(d))add('medium','IP_LITERAL_URL','URL이 IP 주소를 직접 사용합니다',d);if(shorteners.has(d))add('medium','SHORTENED_URL','단축 URL은 최종 목적지 확인이 필요합니다',d);if(d.split('.').length>=6)add('low','DEEP_SUBDOMAIN','URL의 하위 도메인 단계가 비정상적으로 깊습니다',d)}
 for(const m of text.matchAll(/<a\b[^>]*href=["'](https?:\/\/[^"']+)["'][^>]*>([\s\S]*?)<\/a>/gi)){const shown=(m[2].replace(/<[^>]+>/g,' ').match(/https?:\/\/[^\s]+/i)||[])[0];if(shown)try{const actual=new URL(m[1]).hostname, visible=new URL(shown).hostname;if(rootDomain(actual)!=rootDomain(visible))add('high','LINK_TEXT_MISMATCH','표시된 URL과 실제 연결 도메인이 다릅니다',visible+' → '+actual)}catch{}}
 const received=(text.match(/^Received:/gim)||[]).length;if(!received)add('low','NO_RECEIVED','Received 헤더가 없습니다');const date=decodeWord(header(text,'Date')), subject=decodeWord(header(text,'Subject'));findings.sort((x,y)=>({critical:4,high:3,medium:2,low:1}[y.severity]-({critical:4,high:3,medium:2,low:1}[x.severity]))||x.code.localeCompare(y.code));const score=Math.min(100,findings.reduce((n,x)=>n+weights[x.severity],0)), hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(b=>b.toString(16).padStart(2,'0')).join('');return {source:file.name,size:buf.byteLength,subject,from,reply_to:reply,return_path:address(returnRaw),date,auth:a,received_hops:received,risk_score:score,verdict:score>=50?'높은 위험':score>=20?'의심':'낮은 위험',findings,domains,attachments:[...new Set(names)],sha256:hash,analyzed_at:new Date().toISOString()}}
function level(r){return r.risk_score>=50?'high':r.risk_score>=20?'suspicious':'safe'}function levelClass(r){return r.risk_score>=50?'high':r.risk_score>=20?'medium':'safe'}
function renderAll(){if(!results.length)return;$('#toolbar').style.display='flex';$('#summary').style.display='grid';$('#workspace').style.display='grid';$('#count').textContent=`${results.length}개 파일 분석 완료`;const hi=results.filter(r=>r.risk_score>=50).length,sus=results.filter(r=>r.risk_score>=20&&r.risk_score<50).length,safe=results.length-hi-sus,findings=results.reduce((n,r)=>n+r.findings.length,0);$('#summary').innerHTML=`<div class="metric"><b>${results.length}</b><span>전체 메일</span></div><div class="metric"><b style="color:var(--high)">${hi}</b><span>높은 위험</span></div><div class="metric"><b style="color:var(--medium)">${sus}</b><span>의심</span></div><div class="metric"><b style="color:#16803c">${safe}</b><span>낮은 위험</span></div><div class="metric"><b>${findings}</b><span>전체 탐지 건수</span></div>`;renderList();if(selected<0&&results.length){selected=0;renderDetail()}}
function renderList(){const q=$('#search').value.toLowerCase(),f=$('#filter').value;$('#items').innerHTML=results.map((r,i)=>({r,i})).filter(({r})=>(f==='all'||level(r)===f)&&[r.source,r.subject,r.from].join(' ').toLowerCase().includes(q)).map(({r,i})=>`<button class="item ${i===selected?'active':''}" data-i="${i}"><div class="item-top"><span class="pill ${levelClass(r)}">${r.risk_score}</span><strong>${esc(r.subject||'(제목 없음)')}</strong></div><small>${esc(r.from||'발신자 없음')} · ${esc(r.source)}</small></button>`).join('')||'<div class="detail-empty">조건에 맞는 결과가 없습니다.</div>';document.querySelectorAll('.item').forEach(x=>x.onclick=()=>{selected=+x.dataset.i;renderList();renderDetail()})}
function renderDetail(){const r=results[selected];if(!r)return;const findings=r.findings.length?r.findings.map(x=>`<tr><td><span class="sev ${x.severity}">${labels[x.severity]}</span></td><td><code>${esc(x.code)}</code></td><td>${esc(x.message)}</td><td><code>${esc(x.evidence)}</code></td></tr>`).join(''):'<tr><td colspan="4">발견된 위험 요소가 없습니다.</td></tr>';$('#detail').innerHTML=`<div class="detail-head"><div><div class="score">${r.risk_score}<small style="font-size:16px">/100</small></div><div class="verdict">${esc(r.verdict)}</div></div><div style="min-width:0"><div class="subject">${esc(r.subject||'(제목 없음)')}</div><div style="color:var(--muted)">${esc(r.source)}</div></div><div class="detail-actions"><button id="oneReport">개별 보고서</button></div></div><div class="meta"><b>발신자</b><span>${esc(r.from||'-')}</span><b>Reply-To</b><span>${esc(r.reply_to||'-')}</span><b>Return-Path</b><span>${esc(r.return_path||'-')}</span><b>날짜</b><span>${esc(r.date||'-')}</span><b>SPF / DKIM / DMARC</b><span>${esc(r.auth.spf)} / ${esc(r.auth.dkim)} / ${esc(r.auth.dmarc)}</span><b>Received 경유</b><span>${r.received_hops}</span><b>파일 크기</b><span>${(r.size/1024).toFixed(1)} KB</span><b>SHA-256</b><code>${r.sha256}</code></div><h3 class="section-title">탐지 근거</h3><table><thead><tr><th>심각도</th><th>코드</th><th>탐지 내용</th><th>근거</th></tr></thead><tbody>${findings}</tbody></table><h3 class="section-title">추출된 지표</h3><b>URL 도메인</b><div class="chips">${r.domains.length?r.domains.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="chip">없음</span>'}</div><br><b>첨부파일</b><div class="chips">${r.attachments.length?r.attachments.map(x=>`<span class="chip">${esc(x)}</span>`).join(''):'<span class="chip">없음</span>'}</div><div class="notice">초기 분류 결과입니다. 인증 헤더는 수신 시스템이 기록한 값을 읽으며, DKIM 암호 검증·URL 평판·첨부파일 샌드박스를 대체하지 않습니다.</div>`;$('#oneReport').onclick=()=>downloadBlob(reportHtml([r]),safeName(r.source)+'-분석보고서.html','text/html')}
async function run(files){const valid=[...files].filter(f=>f.name.toLowerCase().endsWith('.eml')||f.type==='message/rfc822').slice(0,100);if(!valid.length)return alert('.eml 파일을 선택해 주세요.');d.querySelector('strong').textContent=`${valid.length}개 파일 분석 중…`;const snapshots=await Promise.all(valid.map(async f=>({file:f,buf:await f.arrayBuffer()})));const added=[];for(const {file:f,buf} of snapshots){try{added.push(await analyze(f,buf))}catch(e){added.push({source:f.name,size:f.size,subject:'분석 실패: '+e.message,from:'',reply_to:'',return_path:'',date:'',auth:{spf:'unknown',dkim:'unknown',dmarc:'unknown'},received_hops:0,risk_score:0,verdict:'분석 실패',findings:[],domains:[],attachments:[],sha256:'',analyzed_at:new Date().toISOString()})}}results.push(...added);selected=results.length-added.length;d.querySelector('strong').textContent='.eml 파일을 선택하거나 여러 파일을 여기에 끌어다 놓으세요';renderAll()}
function safeName(s){return s.replace(/[^\p{L}\p{N}._-]+/gu,'-').replace(/\.eml$/i,'')||'메일'}function downloadBlob(content,name,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function reportHtml(rs){const rows=rs.map(r=>`<section><h2>${esc(r.subject||'(제목 없음)')}</h2><p class="score">${r.risk_score}/100 · ${esc(r.verdict)}</p><p><b>파일:</b> ${esc(r.source)}<br><b>발신자:</b> ${esc(r.from)}<br><b>SPF / DKIM / DMARC:</b> ${esc(r.auth.spf)} / ${esc(r.auth.dkim)} / ${esc(r.auth.dmarc)}<br><b>SHA-256:</b> <code>${r.sha256}</code></p><table><tr><th>심각도</th><th>코드</th><th>탐지 내용</th><th>근거</th></tr>${r.findings.map(x=>`<tr><td>${labels[x.severity]}</td><td>${esc(x.code)}</td><td>${esc(x.message)}</td><td><code>${esc(x.evidence)}</code></td></tr>`).join('')||'<tr><td colspan="4">탐지 없음</td></tr>'}</table></section>`).join('');return `<!doctype html><meta charset="utf-8"><title>메일 위협 통합 분석 보고서</title><style>body{font:14px system-ui;max-width:1100px;margin:40px auto;padding:0 20px;color:#172033}section{page-break-inside:avoid;border-top:3px solid #2859d9;padding:15px 0 30px}.score{font-size:24px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd;vertical-align:top}code{overflow-wrap:anywhere}@media print{body{margin:0}}</style><h1>메일 위협 통합 분석 보고서</h1><p>분석 파일 ${rs.length}개 · 생성 ${new Date().toLocaleString('ko-KR')}</p>${rows}`}
$('#file').onchange=e=>run(e.target.files);$('#add').onclick=()=>$('#file').click();const d=$('#drop');for(const ev of ['dragenter','dragover'])d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('drag')});for(const ev of ['dragleave','drop'])d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('drag')});d.addEventListener('drop',e=>run(e.dataTransfer.files));$('#search').oninput=renderList;$('#filter').onchange=renderList;$('#json').onclick=()=>downloadBlob(JSON.stringify(results,null,2),'메일-분석-전체.json','application/json');$('#csv').onclick=()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',rows=[['파일','제목','발신자','위험점수','판정','SPF','DKIM','DMARC','탐지수','SHA-256'],...results.map(r=>[r.source,r.subject,r.from,r.risk_score,r.verdict,r.auth.spf,r.auth.dkim,r.auth.dmarc,r.findings.length,r.sha256])];downloadBlob('\ufeff'+rows.map(x=>x.map(q).join(',')).join('\r\n'),'메일-분석-요약.csv','text/csv;charset=utf-8')};$('#html').onclick=()=>downloadBlob(reportHtml(results),'메일-위협-통합보고서.html','text/html');
</script></body></html>
