<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>메일 위협 초기 분석기</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#667085;--line:#d9e0ea;--brand:#2557d6;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Noto Sans KR",sans-serif}.wrap{max-width:1100px;margin:auto;padding:44px 20px}h1{margin:0;font-size:34px}.lead{color:var(--muted);margin:8px 0 28px}.drop{display:block;border:2px dashed #8ea5d8;border-radius:18px;background:white;padding:42px 20px;text-align:center;cursor:pointer}.drop.drag{background:#eaf0ff}.drop strong{display:block;font-size:19px}.drop span{color:var(--muted)}input{display:none}.privacy{margin:12px 0 0;color:#39734a}.result{display:none;margin-top:28px}.top{display:grid;grid-template-columns:210px 1fr;gap:20px}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:22px}.score{font-size:48px;font-weight:850}.verdict{font-size:20px;font-weight:700}.meta{display:grid;grid-template-columns:130px minmax(0,1fr);gap:9px}.meta b{color:#344054}.meta span,.meta code{overflow-wrap:anywhere}button{border:0;border-radius:10px;background:var(--brand);color:white;padding:11px 16px;font-weight:700;cursor:pointer;margin-top:16px}table{width:100%;border-collapse:collapse;margin-top:20px;background:white;border-radius:16px;overflow:hidden}th,td{text-align:left;padding:12px;border-bottom:1px solid var(--line);vertical-align:top}.sev{display:inline-block;color:white;border-radius:999px;padding:2px 8px;font-size:13px}.critical{background:#7f1d1d}.high{background:#dc2626}.medium{background:#d97706}.low{background:#2563eb}@media(max-width:700px){.top{grid-template-columns:1fr}.meta{grid-template-columns:90px 1fr}table{font-size:13px}th,td{padding:8px}.wrap{padding-top:26px}}
</style></head><body><main class="wrap">
<h1>메일 위협 초기 분석기</h1><p class="lead">의심 메일 원본(.eml)의 인증 결과, 발신자 위장, 위험 첨부파일, 의심 URL을 빠르게 점검합니다.</p>
<label class="drop" id="drop"><input type="file" id="file" accept=".eml,message/rfc822"><strong>.eml 파일을 선택하거나 여기에 끌어다 놓으세요</strong><span>파일은 브라우저 안에서만 처리됩니다.</span></label><p class="privacy">✓ 서버 업로드 없음 · 외부 API 호출 없음 · 파일 저장 없음</p>
<section class="result" id="result"><div class="top"><div class="card"><div class="score" id="score"></div><div class="verdict" id="verdict"></div><button id="download">HTML 보고서 내려받기</button></div><div class="card meta" id="meta"></div></div><table><thead><tr><th>심각도</th><th>코드</th><th>탐지 내용</th><th>근거</th></tr></thead><tbody id="rows"></tbody></table></section>
</main><script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const weights={critical:40,high:25,medium:10,low:3}, labels={critical:'치명',high:'높음',medium:'중간',low:'낮음'};
function header(text,name){const m=text.match(new RegExp('^'+name+':\\s*([^\\r\\n]*(?:\\r?\\n[ \\t]+[^\\r\\n]*)*)','im'));return m?m[1].replace(/\r?\n[ \t]+/g,' ').trim():''}
function address(v){const m=v.match(/<([^>]+)>/);return (m?m[1]:v).trim().replace(/^['"]|['"]$/g,'')}
function auth(text,k){const m=text.match(new RegExp('\\b'+k+'\\s*=\\s*(pass|fail|softfail|neutral|none|temperror|permerror)','i'));return m?m[1].toLowerCase():'unknown'}
async function analyze(file){const buf=await file.arrayBuffer(), text=new TextDecoder('utf-8',{fatal:false}).decode(buf), findings=[];const add=(severity,code,message,evidence='')=>findings.push({severity,code,message,evidence});
 const authText=[...text.matchAll(/^(?:ARC-)?Authentication-Results:\s*([^\r\n]*(?:\r?\n[ \t]+[^\r\n]*)*)/gim)].map(x=>x[1]).join(' '), a={spf:auth(authText,'spf'),dkim:auth(authText,'dkim'),dmarc:auth(authText,'dmarc')};
 for(const [k,v] of Object.entries(a)){if(['fail','softfail','permerror'].includes(v))add('high',k.toUpperCase()+'_FAIL',k.toUpperCase()+' 인증을 통과하지 못했습니다',v);else if(['none','unknown'].includes(v))add('medium',k.toUpperCase()+'_MISSING',k.toUpperCase()+' 결과가 없습니다',v)}
 const fromRaw=header(text,'From'), replyRaw=header(text,'Reply-To'), from=address(fromRaw), reply=address(replyRaw);if(reply&&from&&reply.toLowerCase()!=from.toLowerCase())add('medium','REPLY_TO_MISMATCH','Reply-To가 From과 다릅니다',from+' → '+reply);const display=(fromRaw.match(/^\s*([^<]+)</)||[])[1]||'';if(display.includes('@'))add('medium','DISPLAY_NAME_ADDRESS','표시 이름에 이메일 주소가 포함되어 있습니다',display.trim());
 const names=[...text.matchAll(/filename\*?\s*=\s*(?:UTF-8''|)(?:"([^"]+)"|([^;\r\n]+))/gi)].map(m=>(m[1]||m[2]).trim());for(const n of [...new Set(names)]){if(/\.(exe|scr|js|jse|vbs|vbe|bat|cmd|com|ps1|msi|hta|lnk|iso|img)$/i.test(n))add('high','EXECUTABLE_ATTACHMENT','실행 파일 또는 스크립트 첨부파일입니다',n);else if(/\.(zip|rar|7z|gz|bz2|xz)$/i.test(n))add('medium','ARCHIVE_ATTACHMENT','압축 첨부파일은 샌드박스 검토가 필요합니다',n);if(/\.(pdf|docx?|xlsx?|jpg|png)\.(exe|scr|js|vbs|bat|cmd)$/i.test(n))add('critical','DOUBLE_EXTENSION','첨부파일이 위장 이중 확장자를 사용합니다',n)}
 const domains=new Set();for(const m of text.matchAll(/https?:\/\/[^\s<>"']+/gi)){try{domains.add(new URL(m[0].replace(/[.,);]+$/,'')).hostname.toLowerCase())}catch{}}for(const d of domains){if(d.startsWith('xn--')||d.includes('.xn--'))add('high','PUNYCODE_URL','URL에 IDN 퓨니코드 도메인이 포함되어 있습니다',d);if(/^\d{1,3}(?:\.\d{1,3}){3}$/.test(d))add('medium','IP_LITERAL_URL','URL이 IP 주소를 직접 사용합니다',d)}
 const received=(text.match(/^Received:/gim)||[]).length;if(!received)add('low','NO_RECEIVED','Received 헤더가 없습니다');findings.sort((x,y)=>({critical:4,high:3,medium:2,low:1}[y.severity]-({critical:4,high:3,medium:2,low:1}[x.severity]))||x.code.localeCompare(y.code));const score=Math.min(100,findings.reduce((n,x)=>n+weights[x.severity],0)), hash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',buf))].map(b=>b.toString(16).padStart(2,'0')).join('');return {source:file.name,subject:header(text,'Subject'),from,reply_to:reply,auth:a,received_hops:received,risk_score:score,verdict:score>=50?'높은 위험':score>=20?'의심':'낮은 위험',findings,domains:[...domains],attachments:names,sha256:hash}}
let current;function render(r){current=r;$('#score').textContent=r.risk_score+'/100';$('#verdict').textContent=r.verdict;$('#meta').innerHTML=`<b>파일</b><span>${esc(r.source)}</span><b>제목</b><span>${esc(r.subject)}</span><b>발신자</b><span>${esc(r.from)}</span><b>SPF / DKIM / DMARC</b><span>${esc(r.auth.spf)} / ${esc(r.auth.dkim)} / ${esc(r.auth.dmarc)}</span><b>Received 경유</b><span>${r.received_hops}</span><b>SHA-256</b><code>${r.sha256}</code>`;$('#rows').innerHTML=r.findings.length?r.findings.map(x=>`<tr><td><span class="sev ${x.severity}">${labels[x.severity]}</span></td><td>${esc(x.code)}</td><td>${esc(x.message)}</td><td><code>${esc(x.evidence)}</code></td></tr>`).join(''):'<tr><td colspan="4">발견된 위험 요소가 없습니다.</td></tr>';$('#result').style.display='block';$('#result').scrollIntoView({behavior:'smooth'})}
async function run(f){if(!f||(!f.name.toLowerCase().endsWith('.eml')&&f.type!='message/rfc822'))return alert('.eml 파일을 선택해 주세요.');try{render(await analyze(f))}catch(e){alert('파일을 분석하지 못했습니다: '+e.message)}}
$('#file').onchange=e=>run(e.target.files[0]);const d=$('#drop');for(const ev of ['dragenter','dragover'])d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('drag')});for(const ev of ['dragleave','drop'])d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('drag')});d.addEventListener('drop',e=>run(e.dataTransfer.files[0]));$('#download').onclick=()=>{const h=`<!doctype html><meta charset="utf-8"><title>메일 분석 보고서</title><style>body{font:15px system-ui;max-width:1000px;margin:40px auto;padding:0 20px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #ddd}code{overflow-wrap:anywhere}</style><h1>메일 위협 초기 분석 보고서</h1><h2>${current.risk_score}/100 · ${esc(current.verdict)}</h2><p><b>파일:</b> ${esc(current.source)}<br><b>제목:</b> ${esc(current.subject)}<br><b>발신자:</b> ${esc(current.from)}<br><b>SPF / DKIM / DMARC:</b> ${esc(current.auth.spf)} / ${esc(current.auth.dkim)} / ${esc(current.auth.dmarc)}<br><b>SHA-256:</b> <code>${current.sha256}</code></p><table><tr><th>심각도</th><th>코드</th><th>탐지 내용</th><th>근거</th></tr>${current.findings.map(x=>`<tr><td>${labels[x.severity]}</td><td>${esc(x.code)}</td><td>${esc(x.message)}</td><td>${esc(x.evidence)}</td></tr>`).join('')}</table>`;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h],{type:'text/html'}));a.download='메일-분석-보고서.html';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
</script></body></html>
